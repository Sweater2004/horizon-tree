<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Horizon Tree</title>
    <link rel="stylesheet" href="/static/style/style.css">
    <link rel="stylesheet" href="/static/style/admin.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
    <header>
        <h1>Horizon <span>Tree</span> — Админка</h1>
        <div class="header-right">
            <span class="user-badge" id="userBadge">Загрузка...</span>
            <button class="btn" onclick="window.location.href='/'">На главную</button>
            <button class="btn btn-danger" onclick="logout()">Выйти</button>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <h2>Создать пользователя</h2>
            <div class="admin-form-row">
                <div class="form-group">
                    <label class="form-label">Логин</label>
                    <input type="text" id="newUsername" class="form-input" placeholder="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="минимум 6 символов">
                </div>
                <div class="form-group">
                    <label class="form-label">Роль</label>
                    <select id="newRole" class="form-input">
                        <option value="viewer">Viewer</option>
                        <option value="editor">Editor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="createUser()">Создать</button>
            </div>
            <div id="createUserMessage" class="admin-message"></div>
        </div>
        <div class="admin-card">
            <h2>Пользователи</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Логин</th>
                        <th>Роль</th>
                        <th>Статус</th>
                        <th>Последний вход</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersList">
                    <tr><td colspan="5" style="text-align:center; padding:40px; color: var(--md-on-surface-muted);">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="modal-overlay" id="editUserModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="editUserTitle">Редактировать пользователя</div>
            </div>
            <div class="form-group">
                <label class="form-label">Логин</label>
                <input type="text" id="editUsername" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Новый пароль (оставь пустым, если не менять)</label>
                <input type="password" id="editPassword" class="form-input" placeholder="Минимум 6 символов">
            </div>
            <div class="form-group">
                <label class="form-label">Роль</label>
                <select id="editRole" class="form-input">
                    <option value="viewer">Viewer</option>
                    <option value="editor">Editor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('editUserModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveEditedUser()" id="saveEditedUserBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
